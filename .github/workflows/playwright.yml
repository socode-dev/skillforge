name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Install Java for Firebase Emulator
      run: sudo apt-get update && sudo apt-get install -y default-jre-headless
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: Start Firebase Emulator Suite
      run: npx firebase emulators:start --only auth, firestore, functions --project=demo-project &
    
    - name: Wait for emulators to be ready
      run: sleep 15
    
    - name: Run Playwright tests
      run: npx playwright test
    
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
